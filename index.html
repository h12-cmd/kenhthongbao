<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07070a">
    <meta name="description" content="KENTHONGBAO — Something new is coming.">
    <title>KENTHONGBAO — Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #07070a;
            --text: #ffffff;
            --muted: #8b8b95;
            --border: rgba(255,255,255,.09);
            --card: rgba(255,255,255,.045);
            --accent: #8b6cff;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(139,108,255,.18),
                    transparent 35%
                ),
                var(--bg);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            overflow-x: hidden;
        }
        /* Background glow */
        body::before {
            content: "";
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(139,108,255,.08);
            filter: blur(100px);
            top: -180px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
        .container {
            width: 100%;
            max-width: 680px;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: pageIn .8s ease;
        }
        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Logo */
        .logo {
            font-size: clamp(34px, 9vw, 62px);
            font-weight: 850;
            letter-spacing: -2.8px;
            margin-bottom: 16px;
            background:
                linear-gradient(
                    135deg,
                    #ffffff 20%,
                    #a998ff 80%
                );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Status */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 13px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255,255,255,.035);
            color: #a1a1ab;
            font-size: 11px;
            letter-spacing: 1.2px;
            margin-bottom: 28px;
            backdrop-filter: blur(12px);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #64e68a;
            box-shadow:
                0 0 12px rgba(100,230,138,.8);
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .4;
                transform: scale(.8);
            }
        }
        /* Main title */
        h1 {
            font-size: clamp(36px, 9vw, 58px);
            line-height: 1.04;
            letter-spacing: -2.4px;
            margin-bottom: 18px;
        }
        .description {
            max-width: 470px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }
        /* Countdown */
        .countdown {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 10px;
            max-width: 520px;
            margin: 38px auto 26px;
        }
        .time-box {
            padding: 16px 7px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--card);
            backdrop-filter: blur(14px);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.025);
        }
        .number {
            display: block;
            font-size: 25px;
            font-weight: 750;
            letter-spacing: -.5px;
        }
        .label {
            display: block;
            margin-top: 5px;
            color: #666672;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Discord */
        .discord-card {
            max-width: 520px;
            margin: 0 auto;
            padding: 21px;
            text-align: left;
            border: 1px solid var(--border);
            border-radius: 20px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.018)
                );
            backdrop-filter: blur(18px);
            transition:
                transform .25s ease,
                border-color .25s ease;
        }
        .discord-card:hover {
            transform: translateY(-3px);
            border-color:
                rgba(139,108,255,.25);
        }
        .discord-label {
            color: #777783;
            font-size: 10px;
            letter-spacing: 1.5px;
            margin-bottom: 7px;
        }
        .discord-name {
            font-size: 20px;
            font-weight: 750;
            margin-bottom: 5px;
        }
        .discord-status {
            color: #777783;
            font-size: 13px;
            margin-bottom: 17px;
        }
        .online {
            color: #64e68a;
        }
        .join-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 13px 18px;
            border-radius: 12px;
            background: #ffffff;
            color: #08080b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 750;
            transition:
                transform .2s ease,
                opacity .2s ease;
        }
        .join-button:hover {
            transform: translateY(-2px);
            opacity: .9;
        }
        .join-button:active {
            transform: scale(.98);
        }
        /* Footer */
        footer {
            margin-top: 28px;
            color: #4e4e57;
            font-size: 11px;
        }
        /* Mobile */
        @media (max-width: 430px) {
            body {
                padding: 24px 15px;
            }
            .countdown {
                gap: 7px;
            }
            .time-box {
                padding: 14px 4px;
                border-radius: 14px;
            }
            .number {
                font-size: 21px;
            }
            .label {
                font-size: 8px;
            }
            .discord-card {
                padding: 18px;
            }
            footer {
                margin-top: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <!-- LOGO -->
        <div class="logo">
            KENTHONGBAO
        </div>
        <!-- STATUS -->
        <div class="status">
            <span class="status-dot"></span>
            IN DEVELOPMENT
        </div>
        <!-- MAIN -->
        <h1>
            Something is<br>
            coming.
        </h1>
        <p class="description">
            Một điều mới đang được chuẩn bị.
            KENTHONGBAO sẽ sớm xuất hiện.
        </p>
        <!-- COUNTDOWN -->
        <section class="countdown">
            <div class="time-box">
                <span
                    class="number"
                    id="days"
                >
                    00
                </span>
                <span class="label">
                    Days
                </span>
            </div>
            <div class="time-box">
                <span
                    class="number"
                    id="hours"
                >
                    00
                </span>
                <span class="label">
                    Hours
                </span>
            </div>
            <div class="time-box">
                <span
                    class="number"
                    id="minutes"
                >
                    00
                </span>
                <span class="label">
                    Minutes
                </span>
            </div>
            <div class="time-box">
                <span
                    class="number"
                    id="seconds"
                >
                    00
                </span>
                <span class="label">
                    Seconds
                </span>
            </div>
        </section>
        <!-- DISCORD -->
        <section class="discord-card">
            <div class="discord-label">
                DISCORD COMMUNITY
            </div>
            <div class="discord-name">
                KENTHONGBAO
            </div>
            <div class="discord-status">
                <span class="online">●</span>
                Community server
            </div>
            <!--
                ĐỔI LINK NÀY THÀNH LINK DISCORD CỦA MÀY
            -->
            <a
                class="join-button"
                href="https://discord.gg/YOUR_INVITE"
                target="_blank"
                rel="noopener noreferrer"
            >
                JOIN DISCORD
            </a>
        </section>
        <!-- FOOTER -->
        <footer>
            © 2026 KENTHONGBAO
        </footer>
    </main>
    <script>
        /*
        ==========================================
        KENTHONGBAO COUNTDOWN
        ==========================================
        ĐỔI NGÀY RA MẮT Ở DÒNG BÊN DƯỚI.
        Ví dụ:
        2026-12-31T00:00:00+07:00
        +07:00 = múi giờ Việt Nam.
        ==========================================
        */
        const launchDate =
            new Date(
                "2026-12-31T00:00:00+07:00"
            ).getTime();
        function updateCountdown() {
            const now =
                Date.now();
            const distance =
                launchDate - now;
            /*
            Nếu đã tới ngày launch
            */
            if (distance <= 0) {
                document.getElementById("days")
                    .textContent = "00";
                document.getElementById("hours")
                    .textContent = "00";
                document.getElementById("minutes")
                    .textContent = "00";
                document.getElementById("seconds")
                    .textContent = "00";
                return;
            }
            const days =
                Math.floor(
                    distance /
                    (1000 * 60 * 60 * 24)
                );
            const hours =
                Math.floor(
                    (distance /
                    (1000 * 60 * 60)) % 24
                );
            const minutes =
                Math.floor(
                    (distance /
                    (1000 * 60)) % 60
                );
            const seconds =
                Math.floor(
                    (distance / 1000) % 60
                );
            document.getElementById("days")
                .textContent =
                String(days)
                    .padStart(2, "0");
            document.getElementById("hours")
                .textContent =
                String(hours)
                    .padStart(2, "0");
            document.getElementById("minutes")
                .textContent =
                String(minutes)
                    .padStart(2, "0");
            document.getElementById("seconds")
                .textContent =
                String(seconds)
                    .padStart(2, "0");
        }
        /*
        Chạy ngay khi mở trang
        */
        updateCountdown();
        /*
        Cập nhật mỗi giây
        */
        setInterval(
            updateCountdown,
            1000
        );
    </script>
</body>
</html>
