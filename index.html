<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070d">
  <meta
    name="description"
    content="KENTHONGBAO — Một điều mới đang được phát triển."
  >
  <title>KENTHONGBAO — Coming Soon</title>
  <style>
    /* =========================================================
       RESET
    ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      min-height: 100vh;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      color: #ffffff;
      background: #05070d;
    }
    /* =========================================================
       BACKGROUND
    ========================================================= */
    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(56, 92, 180, 0.20),
          transparent 38%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(70, 90, 180, 0.08),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(120, 70, 180, 0.06),
          transparent 30%
        ),
        #05070d;
    }
    /* Grid */
    .background::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        );
      background-size: 45px 45px;
      mask-image:
        linear-gradient(
          to bottom,
          rgba(0,0,0,1),
          rgba(0,0,0,0)
        );
    }
    /* Glow */
    .glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(70, 100, 255, 0.08);
      filter: blur(100px);
      animation: floatingGlow 9s ease-in-out infinite;
    }
    .glow.one {
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
    }
    .glow.two {
      bottom: -220px;
      right: -100px;
      width: 350px;
      height: 350px;
      background: rgba(120, 70, 255, 0.06);
      animation-delay: -3s;
    }
    /* =========================================================
       MAIN
    ========================================================= */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
    }
    .container {
      width: min(680px, 100%);
      text-align: center;
      animation: pageEnter 1s ease forwards;
    }
    /* =========================================================
       LOGO
    ========================================================= */
    .logo {
      display: inline-block;
      margin-bottom: 18px;
      font-size: clamp(34px, 9vw, 68px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -3px;
      background:
        linear-gradient(
          110deg,
          #ffffff 0%,
          #ffffff 35%,
          #a8c2ff 70%,
          #738cff 100%
        );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
    }
    /* =========================================================
       STATUS
    ========================================================= */
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.09);
      background:
        rgba(255,255,255,0.035);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.03);
      color: #9da8ba;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.7px;
      margin-bottom: 30px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #5cf0aa;
      box-shadow:
        0 0 6px rgba(92,240,170,0.8),
        0 0 16px rgba(92,240,170,0.45);
      animation:
        statusPulse 1.8s ease-in-out infinite;
    }
    /* =========================================================
       TITLE
    ========================================================= */
    h1 {
      margin-bottom: 18px;
      font-size: clamp(38px, 9vw, 64px);
      line-height: 0.98;
      font-weight: 850;
      letter-spacing: -3px;
      color: #ffffff;
    }
    /* =========================================================
       DESCRIPTION
    ========================================================= */
    .description {
      width: min(520px, 100%);
      margin: 0 auto;
      color: #8994a8;
      font-size: 15px;
      line-height: 1.75;
      font-weight: 400;
    }
    /* =========================================================
       COUNTDOWN
    ========================================================= */
    .countdown {
      width: 100%;
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 11px;
      margin-top: 38px;
      margin-bottom: 28px;
    }
    .time-box {
      position: relative;
      padding: 19px 10px 17px;
      border-radius: 17px;
      border: 1px solid rgba(255,255,255,0.075);
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.055),
          rgba(255,255,255,0.025)
        );
      box-shadow:
        0 10px 40px rgba(0,0,0,0.16),
        inset 0 1px 0 rgba(255,255,255,0.025);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
    }
    .time-box:hover {
      transform: translateY(-3px);
      border-color:
        rgba(130,155,255,0.22);
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.03)
        );
    }
    .number {
      display: block;
      color: #ffffff;
      font-size: clamp(25px, 6vw, 40px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }
    .label {
      display: block;
      margin-top: 8px;
      color: #687489;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
    }
    /* =========================================================
       DISCORD BUTTON
    ========================================================= */
    .discord-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 48px;
      padding: 0 19px;
      color: #ffffff;
      text-decoration: none;
      border-radius: 14px;
      border: 1px solid
        rgba(88,101,242,0.30);
      background:
        linear-gradient(
          135deg,
          rgba(88,101,242,0.18),
          rgba(88,101,242,0.07)
        );
      box-shadow:
        0 10px 30px rgba(0,0,0,0.14);
      font-size: 14px;
      font-weight: 700;
      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }
    .discord-button:hover {
      transform: translateY(-3px);
      border-color:
        rgba(110,125,255,0.65);
      background:
        linear-gradient(
          135deg,
          rgba(88,101,242,0.28),
          rgba(88,101,242,0.12)
        );
      box-shadow:
        0 14px 35px rgba(40,50,130,0.20);
    }
    .discord-icon {
      width: 23px;
      height: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    /* =========================================================
       FOOTER
    ========================================================= */
    footer {
      margin-top: 34px;
      color: #465064;
      font-size: 11px;
      letter-spacing: 0.3px;
    }
    /* =========================================================
       MOBILE
    ========================================================= */
    @media (max-width: 520px) {
      .page {
        padding: 25px 15px;
      }
      .logo {
        letter-spacing: -2px;
      }
      h1 {
        letter-spacing: -2px;
      }
      .description {
        padding: 0 5px;
        font-size: 14px;
        line-height: 1.7;
      }
      .countdown {
        gap: 7px;
        margin-top: 30px;
      }
      .time-box {
        padding:
          15px 5px
          14px;
        border-radius: 13px;
      }
      .number {
        font-size: 24px;
      }
      .label {
        margin-top: 6px;
        font-size: 8px;
        letter-spacing: 1px;
      }
      .discord-button {
        min-height: 46px;
        padding: 0 17px;
        font-size: 13px;
      }
      footer {
        margin-top: 28px;
      }
    }
    /* =========================================================
       VERY SMALL PHONES
    ========================================================= */
    @media (max-width: 360px) {
      .logo {
        font-size: 32px;
      }
      h1 {
        font-size: 35px;
      }
      .countdown {
        gap: 5px;
      }
      .time-box {
        padding:
          13px 3px
          12px;
      }
      .number {
        font-size: 21px;
      }
      .label {
        font-size: 7px;
      }
    }
    /* =========================================================
       ANIMATIONS
    ========================================================= */
    @keyframes pageEnter {
      0% {
        opacity: 0;
        transform:
          translateY(22px)
          scale(0.985);
      }
      100% {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }
    @keyframes statusPulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.72);
      }
    }
    @keyframes floatingGlow {
      0%,
      100% {
        transform:
          translateX(-50%)
          translateY(0)
          scale(1);
      }
      50% {
        transform:
          translateX(-50%)
          translateY(25px)
          scale(1.08);
      }
    }
    /* =========================================================
       REDUCED MOTION
    ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <!-- =======================================================
       BACKGROUND
  ======================================================== -->
  <div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
  </div>
  <!-- =======================================================
       MAIN PAGE
  ======================================================== -->
  <main class="page">
    <div class="container">
      <!-- ===================================================
           LOGO
      ==================================================== -->
      <div class="logo">
        KENTHONGBAO
      </div>
      <!-- ===================================================
           STATUS
      ==================================================== -->
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="statusText">
          IN DEVELOPMENT
        </span>
      </div>
      <!-- ===================================================
           TITLE
      ==================================================== -->
      <h1 id="mainTitle">
        Something is coming.
      </h1>
      <!-- ===================================================
           DESCRIPTION
      ==================================================== -->
      <p class="description">
        KENTHONGBAO đang được phát triển.
        Một phiên bản mới đang được chuẩn bị và sẽ sớm xuất hiện.
      </p>
      <!-- ===================================================
           COUNTDOWN
      ==================================================== -->
      <div class="countdown">
        <div class="time-box">
          <span
            class="number"
            id="days"
          >
            00
          </span>
          <span class="label">
            Ngày
          </span>
        </div>
        <div class="time-box">
          <span
            class="number"
            id="hours"
          >
            00
          </span>
          <span class="label">
            Giờ
          </span>
        </div>
        <div class="time-box">
          <span
            class="number"
            id="minutes"
          >
            00
          </span>
          <span class="label">
            Phút
          </span>
        </div>
        <div class="time-box">
          <span
            class="number"
            id="seconds"
          >
            00
          </span>
          <span class="label">
            Giây
          </span>
        </div>
      </div>
      <!-- ===================================================
           DISCORD
      ==================================================== -->
      <a
        class="discord-button"
        href="https://discord.gg/HFsJZ2qaqt"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="discord-icon">
          ◈
        </span>
        <span>
          Tham gia Discord
        </span>
      </a>
      <!-- ===================================================
           FOOTER
      ==================================================== -->
      <footer>
        © 2026 KENTHONGBAO · All rights reserved.
      </footer>
    </div>
  </main>
  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->
  <script>
    /*
    ==========================================================
    KENTHONGBAO COUNTDOWN
    ==========================================================
    Đây là COUNTDOWN CỐ ĐỊNH.
    Không sử dụng:
      - localStorage
      - sessionStorage
      - cookie
      - thời điểm người dùng truy cập lần đầu
    Vì vậy:
      Người A mở web hôm nay
      Người B mở web ngày mai
      Người C mở web sau 1 tháng
    => Tất cả đều đếm tới CÙNG MỘT THỜI ĐIỂM.
    ----------------------------------------------------------
    Định dạng:
      YYYY-MM-DDTHH:MM:SS+07:00
    +07:00 = múi giờ Việt Nam.
    ==========================================================
    */
    /*
    ==========================================================
    NGÀY RA MẮT
    ==========================================================
    HIỆN TẠI:
      15/11/2026
      20:00
      Giờ Việt Nam
    Muốn đổi ngày thì CHỈ CẦN sửa dòng bên dưới.
    ==========================================================
    */
    const LAUNCH_DATE = new Date(
      "2026-11-15T20:00:00+07:00"
    ).getTime();
    /*
    ==========================================================
    LẤY ELEMENT
    ==========================================================
    */
    const daysElement =
      document.getElementById("days");
    const hoursElement =
      document.getElementById("hours");
    const minutesElement =
      document.getElementById("minutes");
    const secondsElement =
      document.getElementById("seconds");
    const titleElement =
      document.getElementById("mainTitle");
    const statusTextElement =
      document.getElementById("statusText");
    /*
    ==========================================================
    FORMAT NUMBER
    ==========================================================
    */
    function formatNumber(number) {
      return String(number).padStart(2, "0");
    }
    /*
    ==========================================================
    COUNTDOWN
    ==========================================================
    */
    function updateCountdown() {
      const now =
        Date.now();
      const distance =
        LAUNCH_DATE - now;
      /*
      --------------------------------------------------------
      ĐÃ ĐẾN NGÀY RA MẮT
      --------------------------------------------------------
      */
      if (distance <= 0) {
        daysElement.textContent =
          "00";
        hoursElement.textContent =
          "00";
        minutesElement.textContent =
          "00";
        secondsElement.textContent =
          "00";
        titleElement.textContent =
          "We are live.";
        statusTextElement.textContent =
          "ONLINE";
        return;
      }
      /*
      --------------------------------------------------------
      TÍNH NGÀY
      --------------------------------------------------------
      */
      const days =
        Math.floor(
          distance /
          (1000 * 60 * 60 * 24)
        );
      /*
      --------------------------------------------------------
      TÍNH GIỜ
      --------------------------------------------------------
      */
      const hours =
        Math.floor(
          (distance /
            (1000 * 60 * 60))
          % 24
        );
      /*
      --------------------------------------------------------
      TÍNH PHÚT
      --------------------------------------------------------
      */
      const minutes =
        Math.floor(
          (distance /
            (1000 * 60))
          % 60
        );
      /*
      --------------------------------------------------------
      TÍNH GIÂY
      --------------------------------------------------------
      */
      const seconds =
        Math.floor(
          (distance / 1000)
          % 60
        );
      /*
      --------------------------------------------------------
      HIỂN THỊ
      --------------------------------------------------------
      */
      daysElement.textContent =
        formatNumber(days);
      hoursElement.textContent =
        formatNumber(hours);
      minutesElement.textContent =
        formatNumber(minutes);
      secondsElement.textContent =
        formatNumber(seconds);
    }
    /*
    ==========================================================
    CHẠY NGAY KHI LOAD
    ==========================================================
    */
    updateCountdown();
    /*
    ==========================================================
    CẬP NHẬT MỖI GIÂY
    ==========================================================
    */
    const countdownTimer =
      setInterval(
        updateCountdown,
        1000
      );
  </script>
</body>
</html>
